name: daily

on:
  schedule:
    # 12:30 UTC = 18:00 IST (6 PM). GH Actions cron can be delayed 15–30 min
    # under load; digest is expected to land by 7 PM IST.
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jobfinder:ci .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_CONFIG_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CONFIG_FILE_ID }}
          GOOGLE_DRIVE_RESUME_FILE_ID: ${{ secrets.GOOGLE_DRIVE_RESUME_FILE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          docker run --rm \
            -e ANTHROPIC_API_KEY \
            -e ANTHROPIC_MODEL \
            -e APIFY_TOKEN \
            -e GCP_SERVICE_ACCOUNT_JSON \
            -e GOOGLE_SHEET_ID \
            -e GOOGLE_DRIVE_CONFIG_FILE_ID \
            -e GOOGLE_DRIVE_RESUME_FILE_ID \
            -e SMTP_HOST \
            -e SMTP_USER \
            -e SMTP_PASS \
            -e RECIPIENT_EMAIL \
            -e DRY_RUN=0 \
            jobfinder:ci
